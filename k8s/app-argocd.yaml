apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-assignment08
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BaquiaxAntonio/arquitectura-de-sistemas.git
    targetRevision: assignment-08
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true