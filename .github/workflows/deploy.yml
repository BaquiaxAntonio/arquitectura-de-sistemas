- name: Generate deployment package
  run: zip -r deploy.zip . -x '*.git*' # Empaqueta todo excepto la carpeta git

- name: Deploy to Elastic Beanstalk
  uses: einaregilsson/beanstalk-deploy@v22
  with:
    aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
    aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    region: us-east-1
    application_name: "assignment-03"
    environment_name: "Assignment-03-env"
    version_label: "app-${{ github.sha }}"
    deployment_package: deploy.zip # <-- CAMBIO AQUÍ: Enviamos el zip completo